# Netlify settings for happy's.
# The build bakes /content into index.html (see scripts/build.mjs) and publishes dist/.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# The CMS editor should never show up in search.
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex"

# Content and photos change through the CMS, so browsers re-check them on every visit.
[[headers]]
  for = "/content/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# /admin without the slash goes to the editor.
[[redirects]]
  from = "/admin"
  to = "/admin/"
  status = 301
