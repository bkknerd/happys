# Netlify settings for happy's. No build step: the repo root is the site.
[build]
  publish = "."

# The CMS editor should never show up in search.
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex"

# Content and photos change through the CMS, so browsers re-check them on every visit.
[[headers]]
  for = "/content/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# /admin without the slash goes to the editor.
[[redirects]]
  from = "/admin"
  to = "/admin/"
  status = 301
